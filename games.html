<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.A.P Gaming Arcade</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; font-family: Arial, sans-serif;
            color: #ffffff; overflow-x: hidden;
        }

        /* Arcade Header & Logo Styling */
        .arcade-header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            background: linear-gradient(to bottom, #111, #050505);
            border-bottom: 2px solid #d4af37;
        }
        
        .brand-logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.4));
        }

        .arcade-header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #d4af37;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .arcade-header p {
            color: #aaaaaa;
            margin-top: 8px;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        /* Game Grid Layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Individual Game Card */
        .game-card {
            background: #111111;
            border: 2px solid #222222;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            border-color: #d4af37;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
        }
        .game-thumbnail {
            width: 100%;
            height: 150px;
            background: #1a1a1a;
            object-fit: cover;
        }
        .game-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .game-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            color: #ffffff;
        }
        .play-btn {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #000000;
            border: none;
            padding: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }
        .game-card:hover .play-btn {
            opacity: 0.9;
        }

        /* Fullscreen Game Player Overlay */
        #game-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000000;
            display: none;
            flex-direction: column;
            z-index: 9999;
        }
        .overlay-header {
            height: 60px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 2px solid #d4af37;
        }
        .now-playing {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
        }
        .exit-btn {
            background: #8b0000;
            color: white;
            border: none;
            padding: 8px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .exit-btn:hover {
            background: #a50000;
        }
        #game-iframe {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
        }
    </style>
</head>
<body>

    <!-- D.A.P Gaming Arcade Hub Interface -->
    <div id="arcade-menu">
        <div class="arcade-header">
            
            <!-- Points to your custom logo file name with space encoding if needed -->
            <img src="D.A.P%20Gaming%20Logo.jpg" alt="D.A.P Gaming Logo" class="brand-logo">
            
            <h1>D.A.P GAMING ARCADE</h1>
            <p>SELECT A TITLE TO INITIATE PLAY</p>
        </div>

        <div class="game-grid" id="gameGridContainer">
            <!-- Game cards injected dynamically -->
        </div>
    </div>

    <!-- Active Game Overlay Modal -->
    <div id="game-overlay">
        <div class="overlay-header">
            <span class="now-playing" id="gameTitleDisplay">LOADING...</span>
            <button class="exit-btn" onclick="closeGameSession()">EXIT GAME</button>
        </div>
        <iframe id="game-iframe" src="" allowfullscreen></iframe>
    </div>

    <script>
        // Replace these with your actual GamePix game titles, thumbnails, and URLs
        const gameCatalog = [
            {
                title: "Action Game Title 1",
                thumbnail: "https://via.placeholder.com/300x150/111/d4af37?text=D.A.P+Gaming",
                url: "https://games.gamepix.com/play/YOUR_GAME_ID?sid=YOUR_AFFILIATE_ID"
            },
            {
                title: "Arcade Game Title 2",
                thumbnail: "https://via.placeholder.com/300x150/111/d4af37?text=D.A.P+Gaming",
                url: "https://games.gamepix.com/play/YOUR_GAME_ID?sid=YOUR_AFFILIATE_ID"
            },
            {
                title: "Strategy Game Title 3",
                thumbnail: "https://via.placeholder.com/300x150/111/d4af37?text=D.A.P+Gaming",
                url: "https://games.gamepix.com/play/YOUR_GAME_ID?sid=YOUR_AFFILIATE_ID"
            }
        ];

        function renderGameGrid() {
            const container = document.getElementById('gameGridContainer');
            container.innerHTML = '';

            gameCatalog.forEach((game) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.thumbnail}" class="game-thumbnail" alt="${game.title}">
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <div class="play-btn">PLAY</div>
                    </div>
                `;
                card.onclick = () => launchGameSession(game.title, game.url);
                container.appendChild(card);
            });
        }

        function launchGameSession(title, url) {
            const overlay = document.getElementById('game-overlay');
            const iframe = document.getElementById('game-iframe');
            const titleDisplay = document.getElementById('gameTitleDisplay');

            titleDisplay.innerText = `NOW PLAYING: ${title.toUpperCase()}`;
            iframe.src = url;
            overlay.style.display = 'flex';
        }

        function closeGameSession() {
            const overlay = document.getElementById('game-overlay');
            const iframe = document.getElementById('game-iframe');

            iframe.src = ''; 
            overlay.style.display = 'none';
        }

        window.onload = renderGameGrid;
    </script>
</body>
</html>
