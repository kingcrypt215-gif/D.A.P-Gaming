<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.A.P Gaming Arcade</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; font-family: Arial, sans-serif;
            color: #ffffff; overflow-x: hidden;
        }

        /* --- SPLASH SCREEN WITH ROTATING D.A.P. GOLD RING --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .splash-logo-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .splash-spinner-ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #d4af37;
            border-right-color: #aa8c2c;
            border-bottom-color: rgba(212, 175, 55, 0.2);
            animation: spinRing 1.5s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .splash-logo {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
        }

        .splash-title {
            font-size: 2.2rem;
            letter-spacing: 4px;
            color: #d4af37;
            margin: 0;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
            text-align: center;
        }

        .splash-tagline {
            color: #aaaaaa;
            margin-top: 10px;
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .loading-bar-container {
            width: 220px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 30px;
            overflow: hidden;
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: #d4af37;
            animation: loadProgress 3.8s forwards ease-in-out;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Arcade Header & Logo Styling */
        .arcade-header {
            text-align: center;
            padding: 30px 20px 20px 20px;
            background: linear-gradient(to bottom, #111, #050505);
            border-bottom: 2px solid #d4af37;
        }
        
        .brand-logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.4));
        }

        .arcade-header h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 3px;
            color: #d4af37;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .arcade-header p {
            color: #aaaaaa;
            margin-top: 6px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Xbox Dashboard Style Horizontal Rails Layout */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .rail-section {
            margin-bottom: 35px;
        }

        .rail-title {
            font-size: 1.2rem;
            color: #d4af37;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-left: 4px solid #d4af37;
            padding-left: 10px;
        }

        .horizontal-rail {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #d4af37 #111;
        }

        .horizontal-rail::-webkit-scrollbar {
            height: 8px;
        }
        .horizontal-rail::-webkit-scrollbar-track {
            background: #111;
            border-radius: 4px;
        }
        .horizontal-rail::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }

        /* Xbox Style Horizontal Game Card */
        .game-card {
            flex: 0 0 280px;
            background: #111111;
            border: 2px solid #222222;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            border-color: #d4af37;
            transform: scale(1.04);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
            z-index: 10;
        }

        .game-thumbnail-container {
            width: 100%;
            height: 140px;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Anti-pixelation smoothing filter applied */
            image-rendering: auto;
            filter: contrast(1.03) saturate(1.05);
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-thumbnail {
            transform: scale(1.08);
        }

        .game-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .game-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 12px 0;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-btn {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #000000;
            border: none;
            padding: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        /* Fullscreen Game Player Overlay */
        #game-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000000;
            display: none;
            flex-direction: column;
            z-index: 9999;
        }
        .overlay-header {
            height: 60px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 2px solid #d4af37;
        }
        .now-playing {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
        }
        .exit-btn {
            background: #8b0000;
            color: white;
            border: none;
            padding: 8px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .exit-btn:hover {
            background: #a50000;
        }
        #game-iframe {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
        }
    </style>
</head>
<body>

    <!-- INTRO SPLASH SCREEN WITH ROTATING LOADING RING -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-spinner-ring"></div>
            <img src="D.A.P%20Gaming%20Logo.jpg" alt="D.A.P Gaming Logo" class="splash-logo" onerror="this.style.display='none'">
        </div>
        <h1 class="splash-title">D.A.P GAMING ARCADE</h1>
        <div class="splash-tagline">Where Fun Is Expected & Respect Is Earned!</div>
        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <!-- D.A.P Gaming Dashboard Hub Interface -->
    <div id="arcade-menu">
        <div class="arcade-header">
            <img src="D.A.P%20Gaming%20Logo.jpg" alt="D.A.P Gaming Logo" class="brand-logo" onerror="this.style.display='none'">
            <h1>D.A.P GAMING ARCADE</h1>
            <p>Where Fun Is Expected & Respect Is Earned!</p>
        </div>

        <div class="dashboard-container" id="dynamicDashboardContainer">
            <!-- Rail 1: Hand-Picked Featured Section at the Top -->
            <div class="rail-section">
                <div class="rail-title">Featured Titles (Curated)</div>
                <div class="horizontal-rail" id="railFeatured"></div>
            </div>
            
            <!-- Dynamic Category Rails Inject Here -->
        </div>
    </div>

    <!-- Active Game Overlay Modal -->
    <div id="game-overlay">
        <div class="overlay-header">
            <span class="now-playing" id="gameTitleDisplay">LOADING...</span>
            <button class="exit-btn" onclick="closeGameSession()">EXIT GAME</button>
        </div>
        <iframe id="game-iframe" src="" allowfullscreen></iframe>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 4000);
            
            renderFeaturedRail();
            fetchAndAutoBuildCategories();
        });

        const featuredGames = [
            { title: "Cyber Strike Pro", thumbnail: "https://images.gamepix.com/games/c/cyber-strike/icon.png", url: "https://games.gamepix.com/play/YOUR_GAME_ID?sid=R7K2K" },
            { title: "Neon Velocity", thumbnail: "https://images.gamepix.com/games/n/neon-velocity/icon.png", url: "https://games.gamepix.com/play/YOUR_GAME_ID?sid=R7K2K" },
            { title: "Shadow Runner X", thumbnail: "https://images.gamepix.com/games/s/shadow-runner/icon.png", url: "https://games.gamepix.com/play/YOUR_GAME_ID?sid=R7K2K" }
        ];

        function renderFeaturedRail() {
            const container = document.getElementById('railFeatured');
            container.innerHTML = '';
            featuredGames.forEach((game) => {
                container.appendChild(createGameCard(game.title, game.thumbnail, game.url));
            });
        }

        function fetchAndAutoBuildCategories() {
            // Increased pagination from 96 to 250 to pull a much larger pool of games
            const feedUrl = "https://feeds.gamepix.com/v2/json?sid=R7K2K&pagination=250&page=1";

            fetch(feedUrl)
                .then(response => response.json())
                .then(data => {
                    const gamesList = Array.isArray(data) ? data : (data.data || data.items || []);
                    organizeAndBuildRails(gamesList);
                })
                .catch(error => {
                    console.error("Error fetching live GamePix feed:", error);
                });
        }

        function normalizeCategoryName(raw) {
            if (!raw) return "Arcade & Classics";
            let cat = String(raw).trim();
            return cat.charAt(0).toUpperCase() + cat.slice(1).toLowerCase();
        }

        function organizeAndBuildRails(gamesArray) {
            const categoriesMap = {};
            const spilloverBin = [];

            gamesArray.forEach(game => {
                let rawCat = game.category || (game.categories && game.categories[0]) || "Arcade";
                if (typeof rawCat === 'object' && rawCat.name) rawCat = rawCat.name;
                
                const catName = normalizeCategoryName(rawCat);

                if (!categoriesMap[catName]) {
                    categoriesMap[catName] = [];
                }
                categoriesMap[catName].push(game);
            });

            const finalMap = {};
            for (const [catName, list] of Object.entries(categoriesMap)) {
                if (list.length >= 2) {
                    finalMap[catName] = list;
                } else {
                    spilloverBin.push(...list);
                }
            }

            if (spilloverBin.length > 0) {
                finalMap["Arcade Highlights"] = spilloverBin;
            }

            const container = document.getElementById('dynamicDashboardContainer');

            for (const [categoryName, gamesList] of Object.entries(finalMap)) {
                const section = document.createElement('div');
                section.className = 'rail-section';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'rail-title';
                titleDiv.innerText = `${categoryName} (${gamesList.length})`;

                const railDiv = document.createElement('div');
                railDiv.className = 'horizontal-rail';

                gamesList.forEach(game => {
                    const title = game.title || game.name || "Untitled Game";
                    
                    let rawImg = game.cover || game.image || game.thumbnailUrl || game.thumbnail_url || game.thumbnail || "";
                    
                    if (rawImg) {
                        // Clean up image links to target higher resolution assets
                        rawImg = rawImg.replace(/100x100/g, '800x450')
                                       .replace(/250x250/g, '800x450');
                        if (rawImg.startsWith('//')) {
                            rawImg = 'https:' + rawImg;
                        }
                    } else {
                        rawImg = 'https://via.placeholder.com/500x250/111/d4af37?text=D.A.P+Gaming';
                    }

                    const url = game.url || game.link || "#";
                    railDiv.appendChild(createGameCard(title, rawImg, url));
                });

                section.appendChild(titleDiv);
                section.appendChild(railDiv);
                container.appendChild(section);
            }
        }

        function createGameCard(title, thumbnail, url) {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="game-thumbnail-container">
                    <img src="${thumbnail}" class="game-thumbnail" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x250/111/d4af37?text=D.A.P+Gaming'">
                </div>
                <div class="game-info">
                    <h3 class="game-title">${title}</h3>
                    <div class="play-btn">PLAY NOW</div>
                </div>
            `;
            card.onclick = () => launchGameSession(title, url);
            return card;
        }

        function launchGameSession(title, url) {
            const overlay = document.getElementById('game-overlay');
            const iframe = document.getElementById('game-iframe');
            const titleDisplay = document.getElementById('gameTitleDisplay');

            titleDisplay.innerText = `NOW PLAYING: ${title.toUpperCase()}`;
            iframe.src = url;
            overlay.style.display = 'flex';
        }

        function closeGameSession() {
            const overlay = document.getElementById('game-overlay');
            const iframe = document.getElementById('game-iframe');

            iframe.src = ''; 
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
